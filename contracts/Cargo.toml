[workspace]
resolver = "2"
members = ["types", "reserve-vault", "router", "inbox"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
repository = "https://github.com/arturete58-sys/kyros2.0"

[workspace.dependencies]
soroban-sdk = "28.0.0"
kyros-types = { path = "types" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
