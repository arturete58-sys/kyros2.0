[package]
name = "kyros-yield-blend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
kyros-types = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
kyros-types = { workspace = true, features = ["testutils"] }
kyros-reserve-vault = { path = "../reserve-vault" }
