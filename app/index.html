<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1117" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Kyros sets your taxes aside the moment you get paid in stablecoins: a vault you own splits every payment." />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kyros" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kyros" />
    <meta property="og:title" content="Kyros: your taxes, set aside the moment you get paid" />
    <meta property="og:description" content="Every stablecoin payment splits itself on Stellar: yours to your wallet, VAT and income tax locked in a vault only you own." />
    <meta property="og:url" content="https://kyrosfinance.com/app/" />
    <meta property="og:image" content="https://kyrosfinance.com/app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Kyros logo: your taxes, set aside the moment you get paid." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://kyrosfinance.com/app/og.png" />
    <title>Kyros</title>
    <style>
      /* Shown by the HTML itself until the app's first screen replaces it. */
      .boot { min-height: 100dvh; display: grid; place-items: center; }
      .boot img { width: 64px; height: 64px; animation: boot 1.4s ease-in-out infinite; }
      @keyframes boot { 50% { opacity: 0.45; } }
      @media (prefers-color-scheme: dark) { .boot img { filter: invert(1) hue-rotate(180deg) brightness(1.4); } }
      @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-busy="true"><img src="/icons/mark.svg" alt="Kyros" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
