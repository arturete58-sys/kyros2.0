name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy, rustfmt
      - name: Install the Stellar CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints (clippy, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs (every public item documented, no broken links)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Unit and integration tests (Stellar mainnet limits enforced)
        run: cargo test
      - name: Build the contracts
        run: stellar contract build
      - name: Wasm sizes (mainnet allows 131,072 bytes per contract)
        run: |
          ls -l target/wasm32v1-none/release/*.wasm
          for f in target/wasm32v1-none/release/*.wasm; do
            size=$(stat -c %s "$f")
            echo "$(basename "$f"): $size bytes" >> "$GITHUB_STEP_SUMMARY"
            if [ "$size" -gt 131072 ]; then echo "::error::$f is $size bytes, above the 131,072-byte limit"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: contracts/target/wasm32v1-none/release/*.wasm

  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm test

