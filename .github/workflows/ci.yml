name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Install the Stellar CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Unit and integration tests
        run: cargo test
      - name: Build the contracts
        run: stellar contract build
      - run: ls -l target/wasm32v1-none/release/*.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: contracts/target/wasm32v1-none/release/*.wasm

  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm test

  invoice-formats:
    # The SDK's invoices against the official schemas and the EN 16931 / Peppol rules.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml saxonche
      - name: Build the SDK and write sample invoices
        working-directory: sdk
        run: |
          npm ci
          npm run build
          node scripts/invoice-samples.mjs ../invoice-samples
      - name: Fetch the schemas and rules
        run: bash sdk/scripts/fetch-invoice-artefacts.sh invoice-artefacts
      - name: Validate
        run: python3 sdk/scripts/validate-invoices.py invoice-samples invoice-artefacts
