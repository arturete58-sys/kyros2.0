name: VAT rate check

# Every Monday: compare the rule packs' VAT tables with an independent dataset and
# flag packs that have not been reviewed recently. Opens (or updates) an issue
# when something needs a look.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['rule-packs/**', 'sdk/scripts/check-vat-rates.mjs']

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare VAT tables
        id: check
        continue-on-error: true
        run: node sdk/scripts/check-vat-rates.mjs --out vat-report.md
      - name: Summary
        if: always()
        run: if [ -f vat-report.md ]; then cat vat-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Open or update an issue
        if: steps.check.outcome == 'failure' && hashFiles('vat-report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('vat-report.md', 'utf8');
            const title = 'Rule packs: VAT rates to review';
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'vat-rates' });
            if (open.length) {
              await github.rest.issues.update({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['vat-rates'] });
            }
      - name: Fail when the check failed
        if: steps.check.outcome == 'failure'
        run: exit 1
