name: Scout

# CoinFabrik's Scout, the static analyzer made for Soroban contracts: looks for
# known vulnerability patterns and deviations from best practice in every
# contract. Findings go to the run summary and to a Markdown report.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['contracts/**/src/**', 'contracts/**/Cargo.toml', '.github/workflows/scout.yml']
  schedule:
    - cron: '23 3 * * 1'

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Scout
        run: |
          cargo install --locked cargo-dylint dylint-link
          cargo install --locked cargo-scout-audit
      - name: Run Scout on every contract
        working-directory: contracts
        run: |
          set +e
          cargo scout-audit --output-format md-gh --output-path ../report.md -- --workspace 2>&1 | tail -200
          echo "exit=$?"
          [ -f ../report.md ] || cargo scout-audit 2>&1 | tail -300
          exit 0
      - name: Summary
        if: always()
        run: |
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; cat report.md; else echo "no report file"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-report
          path: report.md
          if-no-files-found: ignore
