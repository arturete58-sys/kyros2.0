name: Law watch

# Every Monday, and on demand: are the rule packs still the law?
#  1. EU packs against the European Commission's official VAT database (TEDB);
#  2. EU and UK packs against an independent maintained dataset;
#  3. national income-tax scales against the OECD Tax Database (reported by governments);
#  4. every official page the packs cite, for changed percentages or amounts (and, on the
#     tax-calendar pages, changed dates); pages that refuse plain requests are read with a
#     real browser, or from the Internet Archive;
#  5. the public holidays behind the deadlines, against the newest release of the
#     `holidays` package (a new or moved holiday changes rule-packs/holidays).
# Anything that needs a look opens (or updates) one issue. Where the fix is
# unambiguous (an official standard VAT rate that differs, new holiday data),
# the law agent (sdk/scripts/law-agent.mjs) prepares it as a pull request; a
# maintainer reviews and merges it, then signs the registry transactions the
# agent prepares, so vaults that follow the registry change on the legal date
# with no action from users. Nothing is merged or signed automatically.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['rule-packs/*.json', 'rule-packs/holidays/**', 'sdk/scripts/check-*.mjs', 'sdk/scripts/watch-sources.mjs', '.github/workflows/law-watch.yml']

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: law-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the SDK (for the law agent)
        run: cd sdk && npm ci && npm run build
      - name: EU rates against the official TEDB
        id: tedb
        continue-on-error: true
        run: node sdk/scripts/check-vat-official.mjs --out tedb.md --json tedb.json
      - name: EU and UK rates against an independent dataset
        id: dataset
        continue-on-error: true
        run: node sdk/scripts/check-vat-rates.mjs --out dataset.md
      - name: National scales against the OECD Tax Database
        id: oecd
        continue-on-error: true
        run: node sdk/scripts/check-brackets-oecd.mjs --out oecd.md
      - name: Browser for pages that block plain requests
        run: |
          npm i --no-save --prefix sdk playwright@1.48.2
          npx --prefix sdk playwright install --with-deps chromium
      - name: Official pages cited by the packs
        id: pages
        continue-on-error: true
        run: node sdk/scripts/watch-sources.mjs --out pages.md
      - name: Public holidays against the newest holidays release
        id: holidays
        continue-on-error: true
        run: |
          pip install --quiet --upgrade holidays
          if ! python rule-packs/holidays/generate.py --check > holidays.txt 2>&1; then
            { echo "## Public holidays"; echo; echo "The newest release of the \`holidays\` package differs from rule-packs/holidays. $(grep -v Warning holidays.txt | tail -1)"; echo; echo "Run \`python rule-packs/holidays/generate.py\`, review the diff, commit it, then publish to the registry with \`node sdk/scripts/sync-holidays.mjs\`."; } > holidays.md
            exit 1
          fi
      - name: Report
        if: always()
        run: |
          : > report.md
          for f in tedb.md dataset.md oecd.md pages.md holidays.md; do if [ -f "$f" ]; then cat "$f" >> report.md; echo >> report.md; fi; done
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save the official snapshots (pages, OECD figures)
        if: always()
        run: |
          if [ -n "$(git status --porcelain rule-packs/watch)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add rule-packs/watch
            git commit -m 'Law watch: official snapshots'
            git pull --rebase origin main && git push
          fi
      - name: 'Law agent: changes for review'
        id: agent
        if: steps.tedb.outcome == 'failure' || steps.holidays.outcome == 'failure'
        run: |
          node sdk/scripts/law-agent.mjs --findings tedb.json --apply --out agent.md
          if [ "${{ steps.holidays.outcome }}" = failure ]; then python rule-packs/holidays/generate.py; fi
          if [ -n "$(git status --porcelain -- rule-packs ':!rule-packs/watch')" ]; then
            branch="law-agent/$(date -u +%F)"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch -c "$branch"
            git add -- rule-packs ':!rule-packs/watch'
            git commit -m 'Law agent: rule packs from the law watch'
            git push -f origin "$branch"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi
      - name: 'Law agent: open the pull request'
        if: steps.agent.outputs.branch != ''
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.agent.outputs.branch }}
        with:
          script: |
            const fs = require('fs');
            const head = process.env.BRANCH;
            const body = fs.readFileSync('agent.md', 'utf8');
            let link;
            try {
              const { data: open } = await github.rest.pulls.list({ ...context.repo, state: 'open', head: `${context.repo.owner}:${head}` });
              const pr = open[0] ?? (await github.rest.pulls.create({ ...context.repo, head, base: 'main', title: `Law agent: rule packs to review (${head.slice(10)})`, body })).data;
              link = pr.html_url;
            } catch (e) {
              // Repositories that do not let Actions open pull requests: the branch is there to compare.
              link = `https://github.com/${context.repo.owner}/${context.repo.repo}/compare/main...${head}`;
              core.warning(`pull request not opened (${e.message}); compare: ${link}`);
            }
            fs.appendFileSync('report.md', `\n## Law agent\n\nChanges prepared for review: ${link}\n`);
      - name: Open or update an issue
        if: steps.tedb.outcome == 'failure' || steps.dataset.outcome == 'failure' || steps.oecd.outcome == 'failure' || steps.pages.outcome == 'failure' || steps.holidays.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8').slice(0, 60000);
            const title = 'Law watch: rule packs to review';
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'law-watch' });
            if (open.length) await github.rest.issues.update({ ...context.repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['law-watch'] });
