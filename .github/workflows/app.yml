name: App

# Builds the web app, tests it end to end on Stellar testnet with a virtual
# passkey (Face ID) authenticator, and publishes it on GitHub Pages together
# with the website: kyrosfinance.com is the website, kyrosfinance.com/app the app.

on:
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the end-to-end tests on testnet
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['app/**', 'site/**', 'sdk/src/**', 'rule-packs/**', '.github/workflows/app.yml']
  workflow_run:
    workflows: ['App on testnet']
    types: [completed]

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          (cd sdk && npm ci)
          (cd app && npm ci)
          (cd site && npm ci)
      - name: Build the app
        working-directory: app
        env:
          KYROS_BASE: /app/
          # Optional: a Reown (WalletConnect) project id, set as a repository variable. Without it the app leaves WalletConnect out.
          VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
        run: npm run build
      - name: Build the website
        working-directory: site
        run: npm run build
      - name: Put the website and the app together
        run: |
          mkdir -p _site
          cp -r site/index.html site/favicon.ico site/countries.json site/assets site/legal _site/
          if [ -f site/stats.json ]; then cp site/stats.json _site/; fi
          cp -r app/dist _site/app
          echo kyrosfinance.com > _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  e2e:
    needs: build
    # The daily counter update only republishes the website: no need to test the app again.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          (cd sdk && npm ci)
          (cd app && npm ci && npx playwright install --with-deps chromium)
      - name: Is the app deployed on testnet?
        id: cfg
        run: if grep -q '"router"' app/public/testnet.json; then echo "deployed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Passkey sign-up, payment, expected payment and tax payment on testnet
        if: steps.cfg.outputs.deployed == 'true'
        working-directory: app
        env:
          # Marks the test vaults (one extra second of notice) so the website's counter leaves them out.
          VITE_KYROS_E2E: '1'
        run: npm run build && npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: app/e2e-report

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
